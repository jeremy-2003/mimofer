<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="recuerdos-container">
        <h2>Estos son algunos de nuestros recuerdos bonitos de los muchos que tenemos juntos morshy</h2>
        <div class="carousel-container">
            <div class="carousel" [ngStyle]="{ transform: 'translateX(-' + currentIndex * 100 + '%)' }">
                <div class="carousel-item" *ngFor="let item of items">
                    <img *ngIf="item.type === 'image'" [src]="item.src" alt="Recuerdo" class="carousel-image" />
                    <video 
                    *ngIf="item.type === 'video'" 
                    #videoElement
                    autoplay 
                    loop 
                    playsinline 
                    class="carousel-video">
                    <source [src]="item.src" type="video/mp4">
                    Tu navegador no soporta el video.
                  </video>                  
                    <div class="carousel-description">{{ item.description }}</div> <!-- Agregar descripción aquí -->
                </div>
            </div>
            <button class="carousel-control prev" (click)="prevSlide()">❮</button>
            <button class="carousel-control next" (click)="nextSlide()">❯</button>
        </div>
    </div>    
</body>
